<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links - Pet Mania SPR</title>
    <link rel="stylesheet" href="../estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

   

    <div class="container">
        <div class="content">
            <div class="widget1">
                <div class="info-user">
                    <div class="img-user">
                        <img src="../images/logo.svg" alt="user">
                    </div>
                    <div class="name-user">
                        <h1>Pet Mania SPR</h1>
                        <span>Amor, cuidado e tudo o que o seu Pet precisa em um só lugar.</span>
                    </div>
                </div>
                <div class="info-icon">
                    <img src="../images/pata.png" alt="icon">
                </div>
            </div>
            
            <div class="widget3">
               
                <div class="redes-sociais">
                    <a class="box-social tiktok" href="https://www.tiktok.com/@_petmania_spr">
                        <i class="fab fa-tiktok"></i>
                    </a>
                    <a class="box-social instagram" href="https://www.instagram.com/pet_maniaspr">
                        <i class="fab fa-instagram"></i>
                    </a>
                    <a class="box-social github" href="https://petmaniaspr.com.br">
                        <i class="fa-solid fa-globe"></i>
                    </a>
                    <a class="box-social linkedin" href="https://maps.app.goo.gl/DcKp6RRc824SZPAa7">
                       <i class="fa-solid fa-location-dot"></i>
                    </a>
                </div>
            </div>
            
            <div class="widget5">
                <a href="https://calciphertech.vercel.app" class="freelancer" target="_blank">
                    <img src="../images/web-white-icon.png" alt="web">
                    <h1>Desenvolvido Por</h1>
                    <img src="../images/logo-criador.svg" alt="Calcipher Tech">
                </a>
            </div>
            
        </div>
    </div>

    <script src="animationLoading.js"></script>
</body>

</html>
